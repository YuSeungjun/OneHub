[project]
name = "onehub"
version = "0.1.0"
description = "OneHub YouTube video and audio downloader"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.128.8",
    "imageio-ffmpeg>=0.6.0",
    "pydantic>=2.12.5",
    "psutil>=7.2.2",
    "uvicorn>=0.39.0",
    "yt-dlp[default]>=2026.8.19",
]

[dependency-groups]
dev = ["pyinstaller>=6.19.0", "pytest>=8.0", "httpx>=0.28"]
